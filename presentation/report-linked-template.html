<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;background:#eef1f5;color:#1b1e26;-webkit-font-smoothing:antialiased}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid #e6e9ef;border-radius:16px;box-shadow:0 6px 22px rgba(20,30,50,.06);animation:fadein .4s ease both}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:#98a0ad;border-bottom:2px solid #eef1f5}
tbody td{border-bottom:1px solid #f2f4f8}
tbody tr.past{color:#3a4150}
tbody tr.future td{color:#aeb6c2}
tbody tr.cur{background:#eef7ff}
tbody tr.cur td{font-weight:800;color:#12406e}
.mono{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10.5px;font-weight:800}
</style></head>
<body>
<div id="app" style="max-width:1180px;margin:0 auto;padding:26px 30px 56px"></div>
<script>
(function(){
  var R=window.__ROLLUP||null;
  var ASOF=window.__ASOF||"Jul '26";
  var base=[["Apr","2026"],["May","2026"],["Jun","2026"],["Jul","2026"],["Aug","2026"],["Sep","2026"],["Oct","2026"],["Nov","2026"],["Dec","2026"],["Jan","2027"],["Feb","2027"],["Mar","2027"],["Apr","2027"],["May","2027"]];
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function nf(n){return (Math.round(n||0)).toLocaleString();}
  function el(id){return document.getElementById(id);}
  function scope(){return (R&&R.critMode===false)?"all zones":"critical path";}
  function render(){
    var app=el("app");
    if(!R){app.innerHTML='<div class="card" style="padding:22px">Could not load progress data.</div>';return;}
    var CUR=(R.asOfIdx!=null?R.asOfIdx:3);
    var planMo=R.planMonth||[], doneMo=R.critDoneMonth||[], cumP=R.cumP||[], cumD=R.critCum||[];
    var planToDate=R.critPlanToDate||0, doneToDate=R.critDoneToDate||0;
    var behind=R.critBehindQty||0, delay=R.critDelayDays||0;
    var totalPlanned=R.critPlanned||0, totalDone=R.critDone||0;
    var pctToDate=planToDate?Math.round(doneToDate/planToDate*100):0;
    var late=delay>0;
    var col=late?"#c0392b":"#0f7a52";
    var hero='<div class="card" style="padding:22px 26px;margin-bottom:16px">'
      +'<div style="font-size:19px;font-weight:800">Programme — Plan vs Actual &amp; Delay</div>'
      +'<div style="font-size:12px;color:#5b6271;font-weight:500;margin-top:2px">As of <b>'+esc(ASOF)+'</b> · scope: <b>'+scope()+'</b> · April 2026 → May 2027</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:26px;margin-top:16px;align-items:flex-end">'
        +'<div style="padding-right:26px;border-right:1px solid #eef1f5"><div style="font-size:44px;font-weight:800;color:'+col+';line-height:.9">'+(late?("~"+delay):"0")+'<span style="font-size:18px"> d</span></div><div style="font-size:12px;font-weight:700;color:'+col+';margin-top:4px">'+(late?"behind schedule":"on track")+'</div></div>'
        +'<div><div style="font-size:24px;font-weight:800">'+nf(planToDate)+'</div><div style="font-size:11px;color:#5b6271;font-weight:600">Should be done by now (plan-to-date)</div></div>'
        +'<div><div style="font-size:24px;font-weight:800;color:#0f7a52">'+nf(doneToDate)+' <span style="font-size:13px;color:#5b6271">('+pctToDate+'%)</span></div><div style="font-size:11px;color:#5b6271;font-weight:600">Actually done to date</div></div>'
        +'<div><div style="font-size:24px;font-weight:800;color:'+col+'">'+nf(behind)+'</div><div style="font-size:11px;color:#5b6271;font-weight:600">Shortfall (plan − done)</div></div>'
        +'<div><div style="font-size:24px;font-weight:800">'+nf(totalDone)+' / '+nf(totalPlanned)+'</div><div style="font-size:11px;color:#5b6271;font-weight:600">Total done / total planned</div></div>'
      +'</div></div>';

    // month-by-month table
    var rows='';
    for(var i=0;i<14;i++){
      var cls=i<CUR?"past":(i===CUR?"cur":"future");
      var pm=planMo[i]||0, dm=doneMo[i]||0, cp=cumP[i]||0, cd=cumD[i]||0;
      var pc=cp?Math.round(cd/cp*100):0;
      var st = (i>CUR)?'<span style="color:#aeb6c2">—</span>'
        : (cp===0?'<span style="color:#aeb6c2">—</span>'
        : (cd>=cp?'<span class="pill" style="background:#e4f6e4;color:#0ca30c">on track</span>'
        : '<span class="pill" style="background:#fbe4e4;color:#c0392b">behind '+nf(cp-cd)+'</span>'));
      rows+='<tr class="'+cls+'"><td>'+esc(base[i][0])+" "+esc(base[i][1])+(i===CUR?' <span style="font-weight:700;color:#2a78d6">◀ now</span>':'')
        +'</td><td class="mono">'+(pm?nf(pm):"—")+'</td><td class="mono">'+(dm?nf(dm):"—")
        +'</td><td class="mono">'+nf(cp)+'</td><td class="mono">'+nf(cd)+'</td><td class="mono">'+(cp?pc+"%":"—")+'</td><td>'+st+'</td></tr>';
    }
    var tbl='<div class="card" style="padding:18px 22px 12px;margin-bottom:16px">'
      +'<div style="font-size:13px;font-weight:800;margin-bottom:2px">Month-by-month · plan vs actual ('+scope()+')</div>'
      +'<div style="font-size:11px;color:#5b6271;margin-bottom:10px">Each month’s planned &amp; done quantity, and the running cumulative. The <b>now</b> row is the current month.</div>'
      +'<table><thead><tr><th>Month</th><th>Plan (mo)</th><th>Done (mo)</th><th>Cum plan</th><th>Cum done</th><th>Cum %</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';

    // by area
    var areas=(R.byArea||[]);
    var acards=areas.map(function(a){
      var ad=a.delayDays||0, al=ad>0;
      return '<div class="card" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:3px;background:'+a.col+'"></span><div style="font-size:13px;font-weight:800">'+esc(a.label)+'</div></div>'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px"><div><div style="font-size:22px;font-weight:800;color:'+(al?"#c0392b":"#0f7a52")+'">'+(al?("~"+ad+" d"):"on track")+'</div><div style="font-size:10.5px;color:#5b6271;font-weight:600">'+(al?"behind":"schedule")+'</div></div>'
        +'<div style="text-align:right"><div style="font-size:13px;font-weight:800">'+a.pct+'%</div><div style="font-size:10.5px;color:#5b6271;font-weight:600">'+nf(a.done)+' / '+nf(a.planned)+'</div></div></div></div>';
    }).join('');
    var areaBlock=areas.length?('<div style="font-size:11px;font-weight:800;color:#98a0ad;letter-spacing:.4px;text-transform:uppercase;margin:2px 2px 10px">Delay by area</div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px">'+acards+'</div>'):'';

    var note='<div class="card" style="padding:14px 18px;font-size:11px;color:#5b6271;line-height:1.6">'
      +'<b>How delay is calculated:</b> we compare, up to the current month, the <b>cumulative planned quantity</b> (what should be done by now) against the <b>cumulative actual done</b>. The shortfall is converted to days using the planned pace so far: <b>delay days = elapsed days × (plan-to-date − done-to-date) ÷ plan-to-date</b>. Only activities with a monthly plan entered are counted, so keep the plan quantities up to date for an accurate figure. Use the toggle (top-right) to switch between critical-path and all-zones.'
      +'</div>';

    app.innerHTML=hero+tbl+areaBlock+note;
  }
  render();
})();
</script>
</body></html>
